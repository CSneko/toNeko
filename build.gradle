plugins {
    // Loom 1.17 原生支持 26.x 去混淆版本：productionNamespace 自动为 official、
    // 支持 classTweaker 格式的依赖 AW，不再需要 empty-mappings / noIntermediateMappings 等 workaround。
    id 'dev.architectury.loom' version '1.17.491' apply false
    // 26.x 为去混淆 Minecraft：Forge/NeoForge 需改用 loom-no-remap 变体（arch-loom 提示）
    id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
    id 'architectury-plugin' version '3.5.168'
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // Bukkit doesn't use Architectury Loom
    boolean isLoom = project.name != 'bukkit'
    if (isLoom) {
        // 26.x 去混淆：fabric 用 loom，neoforge 用 loom-no-remap
        apply plugin: project.name == 'neoforge' ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
        apply plugin: 'architectury-plugin'
    }
    apply plugin: 'maven-publish'

    if (isLoom) {
        base {
            archivesName = "$rootProject.archives_name-$project.name"
        }
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
//        maven {
//            name = 'ParchmentMC'
//            url = 'https://maven.parchmentmc.org'
//        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven { url = uri("https://oss.sonatype.org/content/groups/public/") }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "Ladysnake Libs"
            url = 'https://maven.ladysnake.org/releases'
        }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
                includeGroup("com.geckolib")
            }
        }

        maven { url 'https://jitpack.io' }
        maven {
            name = "KosmX"
            url = "https://maven.kosmx.dev/"
        }
        flatDir {
            dirs 'libs'
        }
    }

    if (isLoom) {
        loom {
            silentMojangMappingsLicense()
            // 26.2 为 Mojang 去混淆版本（unobfuscated，见 Fabric 文档 Migrating Mappings）：
            // loom 1.17 会自动检测 isUnobfuscated -> productionNamespace=official、useIntermediateMappings=false，
            // 依赖 mod 的 classTweaker AW 也由 AccessWidenerUtils 原生支持，无需任何特殊处理。
            // 官方 fabric-example-mod(26.2) 的依赖块同样没有 mappings 行。
            // 注意：架构上仍需 mappings configuration（arch-loom 校验），见下方 dependencies。
        }

        dependencies {
            minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
            if (project.name != 'neoforge') {
                // 26.x 去混淆后不需要真正的 mappings；但 arch-loom 仍校验 mappings configuration 必须有依赖，
                // 故保留本地空 Tiny jar（仅 header "tiny\t2\t0\tofficial\tintermediary\tnamed"）。
                mappings files("libs/empty-mappings.jar")

                modCompileOnly "me.lucko:fabric-permissions-api:0.3.1"
                modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
            }
            // neoforge 侧的 mappings/Fabric API 由 neoforge/build.gradle 提供（loom-no-remap 无 mappings；FFAPI）

            implementation "com.github.CSneko:NekoAI:$rootProject.nekoai_version"
            implementation 'com.github.umjammer:jlayer:1.0.3'
        }
    }

    if (isLoom) {
        dependencies {
            compileOnly("org.projectlombok:lombok:1.18.46")
            annotationProcessor("org.projectlombok:lombok:1.18.46")
        }
    }

    if (isLoom) {
        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }
        tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
            // JDK 23+ 默认关闭隐式注解处理；Gradle 9 + JDK 25 的 toolchain worker 会过滤
            // `-proc`/`-processor`，且编译在 Gradle 进程内执行时 Lombok 无法修改 javac AST。
            // 因此显式 fork 到当前 Java 25 的真实 javac 进程，Lombok 才会生效。
            it.options.fork = true
            it.options.forkOptions.executable = "${System.getProperty('java.home')}/bin/javac"
            // Gradle 会过滤普通 compilerArgs 中的 -proc；用 ArgumentProvider 原样传给 javac
            it.options.compilerArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
                @Override
                List<String> asArguments() {
                    return ['-proc:full', '-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor']
                }
            })
        }
    }

    // Configure Maven publishing.
    if (isLoom) {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = base.archivesName.get()
                    from components.java
                }
            }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
    }
}
