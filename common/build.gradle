architectury {
    common rootProject.enabled_platforms.split(',').findAll { it != 'bukkit' }
}

repositories {
}


dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // GeckoLib 5.x for 26.2 moved to com.geckolib (not software.bernie.geckolib)
    // Fabric/NeoForge variants are com.geckolib:geckolib-fabric-26.2 / geckolib-neoforge-26.2, common is geckolib-common-26.1.2
    modImplementation "com.geckolib:geckolib-common-26.1.2:${geckolib_version}"
    // 26.x 迁移说明：EMI（emi-xplat-intermediary）与 PlayerAnimator（dev.kosmx.player-anim）
    // 目前均没有 26.x 的发布；其旧版 jar 内嵌 intermediary 命名空间的 accessWidener，
    // 在去混淆构建的 official 生产命名空间下 remap 会直接失败，因此相关依赖与集成代码一并移除。
    // permissions-api 为纯 API（无 AW），保留。
}


loom {
    accessWidenerPath = file("src/main/resources/toneko.accesswidener")
}


// Keep plain Java regression checks separate from the JUnit test source set.
sourceSets {
    mushroomTest {
        java.srcDir 'src/mushroomTest/java'
        compileClasspath = files(sourceSets.main.output)
        runtimeClasspath = files(output, sourceSets.main.output)
    }
    worldgenTest {
        java.srcDir 'src/worldgenTest/java'
        compileClasspath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
        runtimeClasspath = files(output, sourceSets.main.runtimeClasspath)
    }
}
tasks.named('compileMushroomTestJava', JavaCompile) {
    options.compilerArgumentProviders.clear()
}
tasks.named('compileWorldgenTestJava', JavaCompile) {
    options.compilerArgumentProviders.clear()
}
tasks.register('mushroomRulesTest', JavaExec) {
    dependsOn mushroomTestClasses
    classpath = sourceSets.mushroomTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.entities.MushroomRulesTest'
}
tasks.register('coffeeWorldgenCodecTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.worldgen.CoffeeWorldgenCodecTest'
    args file('src/main/resources/data/toneko/worldgen').absolutePath
    workingDir layout.buildDirectory.dir('worldgenTest').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.register('mushroomNativeRegressionTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.entities.MushroomNativeRegressionTest'
    workingDir layout.buildDirectory.dir('worldgenTest').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.register('mushroomSporeRegressionTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.entities.MushroomSporeRegressionTest'
    workingDir layout.buildDirectory.dir('worldgenTest').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.register('mushroomBedRestRegressionTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.entities.MushroomBedRestRegressionTest'
    workingDir layout.buildDirectory.dir('worldgenTest').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.register('mushroomCompanionRegressionTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.testing.CompanionMixinLauncher'
    workingDir layout.buildDirectory.dir('companionTest').get().asFile
    systemProperty 'fabric.addMods', sourceSets.worldgenTest.output.resourcesDir.absolutePath
    doFirst { workingDir.mkdirs() }
}
tasks.register('mushroomClientRegressionTest', JavaExec) {
    dependsOn worldgenTestClasses
    classpath = sourceSets.worldgenTest.runtimeClasspath
    mainClass = 'org.cneko.toneko.common.mod.testing.CompanionMixinLauncher'
    args 'client'
    workingDir layout.buildDirectory.dir('clientRegressionTest').get().asFile
    systemProperty 'fabric.addMods', sourceSets.worldgenTest.output.resourcesDir.absolutePath
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn 'mushroomRulesTest', 'coffeeWorldgenCodecTest', 'mushroomNativeRegressionTest', 'mushroomSporeRegressionTest', 'mushroomBedRestRegressionTest', 'mushroomCompanionRegressionTest', 'mushroomClientRegressionTest' }
