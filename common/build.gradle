architectury {
    common rootProject.enabled_platforms.split(',').findAll { it != 'bukkit' }
}

repositories {
}


dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    //include "maven.modrinth:ctlibmod:0.1.13"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    modCompileOnly "dev.emi:emi-xplat-intermediary:${emi_version}:api"
    modCompileOnly "dev.kosmx.player-anim:player-animation-lib:${player_animator_version}"
    modCompileOnly "dev.kosmx.player-anim:anim-core:${player_animator_version}"

}


loom {
    accessWidenerPath = file("src/main/resources/toneko.accesswidener")
}